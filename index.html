    '<div class="sw"><div>Bodyweight movement</div><button class="tg' + (s.bw ? " on" : "") + '" data-act="customFlag" data-k="bw" role="switch"></button></div>' +
    '<div class="sw"><div>Timed hold (seconds)</div><button class="tg' + (s.timed ? " on" : "") + '" data-act="customFlag" data-k="timed" role="switch"></button></div>' +
    '<div class="field" style="margin-top:10px"><label>Video link (optional)</label><input class="inp" value="' + esc(s.video) + '" data-chg="sf" data-k="video" autocapitalize="off" autocorrect="off"></div>' +
    '<div class="row"><button class="btn grow" data-act="closeSheet">Cancel</button><button class="btn pri grow" data-act="customSave">Save</button></div>');
}
A.customFlag = d => { ui.sheet[d.k] = !ui.sheet[d.k]; render(); };
A.customSave = () => {
  const s = ui.sheet; const nm = (s.name || "").trim();
  if (!nm) { toast("Give it a name first"); return; }
  const rmax = Math.max(s.repMin, s.repMax);
  S.custom.push({
    id: "c_" + uid(), name: nm, p: s.p, sec: [], equip: s.equip, kind: s.kind, repMin: s.repMin, repMax: rmax, sets: s.sets, rest: s.kind === "compound" ? 90 : 60,
    incr: 5, startW: 0, stress: [], cues: ["Control the weight on the way down", "Keep your core braced", "Stop a rep or two before form breaks"], avoid: "Using momentum",
    bw: s.bw, timed: s.timed, video: (s.video || "").trim(), custom: true
  });
  queueCloud(); saveState(); closeSheetSafe(); toast("Exercise added");
};

/* ----- add to workout ----- */
A.addEx = () => { ui.lib = { q: "", m: "", e: "" }; openSheet({ type: "addEx" }); };
A.addExPick = d => {
  const a = S.active, e = getEx(d.id), c = exCfg(d.id), t = coachTarget(d.id);
  a.ex.push({ exId: d.id, slotId: "x", pr: 9, sets: c.sets, repMin: c.repMin, repMax: c.repMax, rest: c.rest, ss: "", skipped: false, log: [], curW: t.w, curR: t.reps });
  a.cur = a.ex.length - 1; saveState(); closeSheetSafe(); toast(e.name + " added");
};

/* ----- run list ----- */
A.runList = () => openSheet({ type: "runList" });
function sheetRunList() {
  const a = S.active;
  return sheetWrap('<h2 class="t">Your workout</h2><div class="mut" style="margin-bottom:8px">' + esc(a.name) + "</div><div class=\"card list\" style=\"padding:4px 16px\">" + a.ex.map((x, i) => {
    const e = getEx(x.exId), st = x.skipped ? "Skipped" : x.log.length + "/" + x.sets;
    return '<button class="it" data-act="jump" data-i="' + i + '"><div class="grow"><div class="b">' + (i === a.cur ? "&#9654; " : "") + esc(e.name) + '</div><div class="sm mut">' + st + (x.ss ? " &middot; superset" : "") + '</div></div><span class="pill ' + (exComplete(x) && !x.skipped ? "ok" : "") + '">' + (exComplete(x) && !x.skipped ? "Done" : st) + "</span></button>";
  }).join("") + '</div><div class="row" style="flex-wrap:wrap"><button class="btn grow" data-act="addEx">+ Add exercise</button><button class="btn grow" data-act="timeLeft">Short on time?</button></div><button class="btn block" style="margin-top:8px" data-act="closeSheet">Back to workout</button>');
}
A.jump = d => { S.active.cur = +d.i; saveSoon(); closeSheetSafe(); };
A.timeLeft = () => { ui.sheet = { type: "timeLeft" }; render(); };
A.timeLeftDo = d => {
  const msg = refitActive(+d.m); const a = S.active; const x = a.ex[a.cur];
  if (exComplete(x)) { const n = findNextIncomplete(a.cur); if (n >= 0) a.cur = n; }
  saveState(); closeSheetSafe(); toast(msg);
};

/* ----- edit a logged set ----- */
A.editSet = d => { const x = S.active.ex[S.active.cur], l = x.log[+d.i]; openSheet({ type: "editSet", i: +d.i, w: toDisp(l.w), r: l.r, feel: l.feel || "" }); };
function sheetEditSet(s) {
  const x = S.active.ex[S.active.cur], e = getEx(x.exId);
  return sheetWrap('<h2 class="t">Edit set ' + (s.i + 1) + '</h2><div class="mut" style="margin-bottom:6px">' + esc(e.name) + "</div>" +
    (e.timed ? "" : stepRow("Weight (" + unitLabel() + ")", "w", s.w, 0, 1500, stepDisp(e), "")) + stepRow(e.timed ? "Seconds" : "Reps", "r", s.r, 0, 200, e.timed ? 5 : 1, "") +
    '<div class="row" style="margin-top:14px"><button class="btn danger grow" data-act="delSet">Delete set</button><button class="btn pri grow" data-act="saveSet">Save</button></div>');
}
A.saveSet = () => { const s = ui.sheet, l = S.active.ex[S.active.cur].log[s.i]; l.w = fromDisp(s.w); l.r = s.r; saveState(); closeSheetSafe(); };
A.delSet = () => { const x = S.active.ex[S.active.cur]; x.log.splice(ui.sheet.i, 1); saveState(); closeSheetSafe(); };

/* ----- finish ----- */
A.finish = () => {
  const a = S.active, n = a.ex.reduce((t, x) => t + x.log.length, 0);
  openSheet({ type: "finish", rating: 0, n });
};
function sheetFinish(s) {
  const a = S.active;
  if (!s.n) return sheetWrap('<h2 class="t">Nothing logged yet</h2><div class="mut" style="margin:6px 0 16px">You have not logged any sets. Keep going or discard this workout.</div><div class="row"><button class="btn grow" data-act="closeSheet">Keep going</button><button class="btn danger grow" data-act="discard">Discard</button></div>');
  const done = a.ex.reduce((t, x) => t + x.log.length, 0), left = a.ex.filter(x => !exComplete(x)).length;
  return sheetWrap('<h2 class="t">Finish workout?</h2><div class="mut" style="margin:4px 0 12px">' + done + " sets logged" + (left ? ", " + left + " exercise" + (left > 1 ? "s" : "") + " not finished" : "") + '.</div><div class="b">How did it feel?</div><div class="rating">' +
    [[1, "&#128555;"], [2, "&#128528;"], [3, "&#128578;"], [4, "&#128170;"], [5, "&#128293;"]].map(r => '<button class="' + (s.rating === r[0] ? "on" : "") + '" data-act="sfSet" data-k="rating" data-v="' + r[0] + '" data-n="1" aria-label="Rating ' + r[0] + '">' + r[1] + "</button>").join("") + "</div>" +
    '<div class="field"><label>Notes (optional)</label><textarea class="inp" id="finNotes" placeholder="Anything to remember next time"></textarea></div>' +
    '<button class="btn pri big block" data-act="saveWorkout">Save workout</button><div class="row" style="margin-top:8px"><button class="btn grow" data-act="closeSheet">Keep going</button><button class="btn danger ghost grow" data-act="discard">Discard</button></div>');
}
A.discard = () => confirmSheet("Discard workout?", "Everything you logged today will be lost.", "Discard", () => { S.active = null; ui.runView = false; releaseWake(); saveState(); closeSheetSafe(); });
A.saveWorkout = () => {
  const notes = ($("#finNotes") || {}).value || "", rating = ui.sheet.rating;
  const res = finishActive(rating, notes);
  releaseWake(); ui.runView = false; ui.dayIdx = null;
  if (res && res.sess) {
    res.sess.prs = res.prs; saveState();
    ui.sheet = { type: "done", sess: res.sess, prs: res.prs };
    queueOp("session", res.sess.id, res.sess);
  } else { ui.sheet = null; ui.sheetPushed = false; }
  render();
};
function sheetDone(s) {
  const x = s.sess, vol = sessionVolume(x);
  let h = '<h2 class="t">Workout complete &#127881;</h2><div class="mut">' + esc(x.name) + '</div><div class="kpi"><div><div class="n">' + x.actualMin + '</div><div class="l">MINUTES</div></div><div><div class="n">' + sessionSetCount(x) + '</div><div class="l">SETS</div></div><div><div class="n">' + Math.round(toDisp(vol)).toLocaleString() + '</div><div class="l">' + unitLabel().toUpperCase() + " LIFTED</div></div></div>";
  if (s.prs.length) h += '<div class="card"><h2>New personal records</h2>' + s.prs.map(p => { const e = getEx(p.exId); return '<div class="row between" style="padding:6px 0"><div class="b">&#127942; ' + esc(e.name) + '</div><div class="sm mut">' + (e.timed ? p.r + "s" : (p.w > 0 ? fmtW(p.w) + " " + unitLabel() + " × " : "") + p.r) + "</div></div>"; }).join("") + "</div>";
  const ups = x.ex.map(o => ({ e: getEx(o.exId), t: coachTarget(o.exId) })).filter(o => o.t.kind === "level");
  if (ups.length) h += '<div class="card"><h2>Level up next time</h2>' + ups.map(o => '<div class="row between" style="padding:6px 0"><div class="b">' + esc(o.e.name) + '</div><div class="ok b">' + fmtW(o.t.w) + " " + unitLabel() + "</div></div>").join("") + "</div>";
  else h += '<div class="coach">Next time the coach will tell you exactly what to aim for on every lift. Log your sets honestly and progress follows.</div>';
  return sheetWrap(h + '<button class="btn pri big block" data-act="closeSheet">Done</button>');
}

/* ----- body log ----- */
A.bodyLog = () => openSheet({ type: "bodyLog", id: "", date: dstr(), weight: "", waist: "", chest: "", arms: "", hips: "" });
A.bodyEdit = d => { const b = S.body.find(x => x.id === d.id); openSheet({ type: "bodyLog", id: b.id, date: b.date, weight: b.weight ? fmtW(b.weight) : "", waist: b.waist || "", chest: b.chest || "", arms: b.arms || "", hips: b.hips || "" }); };
function sheetBody(s) {
  const f = (k, lab, ph) => '<div class="field"><label>' + lab + '</label><input class="inp" inputmode="decimal" value="' + esc(s[k]) + '" data-chg="sf" data-k="' + k + '" placeholder="' + (ph || "") + '"></div>';
  return sheetWrap('<h2 class="t">' + (s.id ? "Edit entry" : "Log body stats") + '</h2><div class="mut" style="margin-bottom:12px">Fill in whatever you measured. Measure at the same time of day for the best trend.</div>' +
    '<div class="field"><label>Date</label><input class="inp" type="date" value="' + s.date + '" data-chg="sf" data-k="date"></div>' + f("weight", "Body weight (" + unitLabel() + ")") +
    '<div class="row"><div class="grow">' + f("waist", "Waist (in)") + '</div><div class="grow">' + f("hips", "Hips (in)") + '</div></div><div class="row"><div class="grow">' + f("chest", "Chest (in)") + '</div><div class="grow">' + f("arms", "Arms (in)") + "</div></div>" +
    '<div class="row"><button class="btn grow" data-act="closeSheet">Cancel</button><button class="btn pri grow" data-act="bodySave">Save</button></div>' + (s.id ? '<button class="btn danger ghost block" style="margin-top:8px" data-act="bodyDel">Delete entry</button>' : ""));
}
A.bodySave = () => {
  const s = ui.sheet, n = k => { const v = parseFloat(String(s[k]).replace(",", ".")); return isNaN(v) || v <= 0 ? 0 : v; };
  const rec = { id: s.id || uid(), date: s.date, weight: n("weight") ? fromDisp(n("weight")) : 0, waist: n("waist"), chest: n("chest"), arms: n("arms"), hips: n("hips"), updatedAt: Date.now() };
  if (!rec.weight && !rec.waist && !rec.chest && !rec.arms && !rec.hips) { toast("Enter at least one number"); return; }
  const i = S.body.findIndex(b => b.id === rec.id);
  if (i >= 0) S.body[i] = rec; else S.body.push(rec);
  queueOp("body", rec.id, rec); saveState(); closeSheetSafe(); toast("Saved");
};
A.bodyDel = () => { const b = S.body.find(x => x.id === ui.sheet.id); if (b) { b.deleted = true; b.updatedAt = Date.now(); queueOp("body", b.id, b); } saveState(); closeSheetSafe(); };

/* ----- session detail ----- */
A.sessDetail = d => openSheet({ type: "sessDetail", id: d.id });
function sheetSess(s) {
  const x = S.sessions.find(q => q.id === s.id); if (!x) return "";
  return sheetWrap('<h2 class="t">' + esc(x.name) + '</h2><div class="mut" style="margin-bottom:8px">' + fmtDateLong(x.date) + " &middot; " + x.actualMin + " min" + (x.rating ? " &middot; felt " + ["", "rough", "okay", "good", "strong", "on fire"][x.rating] : "") + "</div>" +
    '<div class="card">' + (x.ex || []).map(o => { const e = getEx(o.exId); return '<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="b">' + esc(e ? e.name : o.exId) + '</div><div class="sm mut">' + esc(e ? fmtSets(e, doneSets(o)) : "") + "</div></div>"; }).join("") + "</div>" +
    (x.notes ? '<div class="card"><h2>Notes</h2><div class="sm">' + esc(x.notes) + "</div></div>" : "") +
    '<div class="row"><button class="btn grow" data-act="closeSheet">Close</button><button class="btn danger grow" data-act="delSess" data-id="' + x.id + '">Delete</button></div>');
}
A.delSess = d => confirmSheet("Delete this workout?", "It is removed from your history and charts.", "Delete", () => {
  const x = S.sessions.find(q => q.id === d.id); if (x) { x.deleted = true; x.updatedAt = Date.now(); queueOp("session", x.id, x); }
  saveState(); closeSheetSafe();
});

/* ----- sync help ----- */
A.syncHelp = () => openSheet({ type: "syncHelp" });
function sheetSyncHelp() {
  return sheetWrap('<h2 class="t">Set up Google Sheets sync</h2><ol class="cues" style="margin-top:10px"><li>Create a new Google Sheet. Call it Gym Coach Data.</li><li>Open Extensions, then Apps Script.</li><li>Delete the sample code and paste in the contents of <a href="Code.gs" target="_blank" rel="noopener">Code.gs</a> from this app.</li><li>Click Deploy, then New deployment. Choose Web app. Run as Me and give access to Anyone.</li><li>Copy the Web app URL and paste it into the box in Settings. Tap Test.</li><li>If you ever edit the script, make a brand new deployment and paste the new URL.</li></ol>' +
    '<div class="sm mut">Your workouts, body stats and settings are copied to the sheet. You also get readable Sets and Body tabs for your own charts. No sign in is needed on the phone, so treat the URL like a password.</div><button class="btn block" style="margin-top:12px" data-act="closeSheet">Got it</button>');
}
A.resetAll = () => confirmSheet("Erase everything?", "This deletes your workouts, body stats and settings on this device. Data already in your Google Sheet stays there.", "Erase", () => { S = defaultState(); saveState(); closeSheetSafe(); ui.sheet = { type: "setup", name: "", days: 4, minutes: 50, focus: ["full", "upper", "core"], units: "lb" }; render(); });

/* ===== Boot ===== */
function boot() {
  loadState();
  applyTheme();
  if (!S.cfg.setupDone && !S.active) {
    ui.sheet = { type: "setup", name: S.cfg.name, days: S.cfg.days, minutes: S.cfg.minutes, focus: S.cfg.focus.slice(), units: S.cfg.units };
  }
  if (S.active && Date.now() - S.active.startedAt < 8 * 3600 * 1000) {
    ui.runView = true;
    if (S.active.rest && S.active.rest.end < Date.now()) S.active.rest.fired = true;
    acquireWake();
  }
  render();
  window.addEventListener("pagehide", saveState);
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  if (S.cfg.scriptUrl) setTimeout(() => syncNow(false), 800);
}
boot();

</script>
</body>
</html>
