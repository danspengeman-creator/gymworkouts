<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gym Coach</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--card2:#eceef2;--text:#14161a;--mut:#5b6472;--line:#dde0e7;
  --acc:#d93f12;--acc-t:#ffffff;--acc-soft:rgba(217,63,18,.12);--ok:#15803d;--ok-soft:rgba(21,128,61,.14);
  --warn:#b45309;--warn-soft:rgba(180,83,9,.14);--bad:#dc2626;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
  --tab-h:64px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1013;--card:#171a1f;--card2:#222730;--text:#f1f3f6;--mut:#a0a9b8;--line:#2a2f38;
    --acc:#ff6a3d;--acc-t:#1a0a04;--acc-soft:rgba(255,106,61,.16);--ok:#4ade80;--ok-soft:rgba(74,222,128,.14);
    --warn:#fbbf24;--warn-soft:rgba(251,191,36,.14);--bad:#f87171;--shadow:none}
}
html[data-theme=light]{--bg:#f4f5f7;--card:#ffffff;--card2:#eceef2;--text:#14161a;--mut:#5b6472;--line:#dde0e7;--acc:#d93f12;--acc-t:#fff;--acc-soft:rgba(217,63,18,.12);--ok:#15803d;--ok-soft:rgba(21,128,61,.14);--warn:#b45309;--warn-soft:rgba(180,83,9,.14);--bad:#dc2626;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05)}
html[data-theme=dark]{--bg:#0e1013;--card:#171a1f;--card2:#222730;--text:#f1f3f6;--mut:#a0a9b8;--line:#2a2f38;--acc:#ff6a3d;--acc-t:#1a0a04;--acc-soft:rgba(255,106,61,.16);--ok:#4ade80;--ok-soft:rgba(74,222,128,.14);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.14);--bad:#f87171;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:12px;font-weight:600}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.top .sub{color:var(--mut);font-size:14px;margin-top:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mut);vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.card h3{font-size:17px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}
.ok{color:var(--ok)}.warn{color:var(--warn)}.acc{color:var(--acc)}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);color:var(--acc-t);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:12px}
.btn.block{display:flex;width:100%}
.btn.big{min-height:64px;font-size:20px;border-radius:18px;letter-spacing:.01em}
.btn{white-space:nowrap;text-decoration:none}
a.btn{color:var(--text)}
a.btn.pri{color:var(--acc-t)}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:15px;display:inline-flex;align-items:center}
.chip.on{background:var(--acc);color:var(--acc-t);border-color:transparent}
.chip.lg{min-height:46px;padding:0 18px;font-size:16px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x .chip{flex:none}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.big-num{font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card2);color:var(--mut)}
.pill.acc{background:var(--acc-soft);color:var(--acc)}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.week{display:flex;gap:8px}
.wd{flex:1;height:10px;border-radius:6px;background:var(--card2)}.wd.on{background:var(--acc)}
.timebox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.round{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:28px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.exrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.exrow:first-of-type{border-top:0}
.exrow.ss{border-left:3px solid var(--acc);padding-left:10px;margin-left:-2px}
.exrow .nm{font-weight:700;font-size:16px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.banner{background:var(--acc);color:var(--acc-t);border-radius:18px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.banner .btn{background:var(--acc-t);color:var(--acc);border:0}
.tip{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.tip:first-of-type{border-top:0;padding-top:0}
.tip .ic{width:36px;height:36px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:6px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 14px;font-size:16px}
textarea.inp{padding:12px 14px;min-height:80px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);gap:12px}
.sw:first-of-type{border-top:0}
.tg{width:52px;height:30px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.15s}
.tg.on{background:var(--acc);border-color:transparent}.tg.on::after{left:25px;background:var(--acc-t)}
.bars .bar{display:flex;align-items:center;gap:10px;margin:7px 0}
.bars .lbl{width:92px;font-size:14px;font-weight:600}
.bars .trk{flex:1;height:12px;border-radius:7px;background:var(--card2);position:relative;overflow:hidden}
.bars .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--acc)}
.bars .fill.lo{background:var(--warn)}.bars .fill.hi{background:var(--ok)}
.bars .val{width:34px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;color:var(--mut)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--mut);font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:11px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:5px;background:var(--card2)}
.heat i.l1{background:var(--acc-soft)}.heat i.l2{background:var(--acc);opacity:.65}.heat i.l3{background:var(--acc)}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list .it:first-child{border-top:0}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92dvh;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .18s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.sheet h2.t{font-size:22px;font-weight:800;margin-bottom:4px;letter-spacing:-.01em}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:80;max-width:88vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
/* runner */
.run{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.run .rtop{padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;max-width:560px;width:100%;margin:0 auto}
.run .rbody{flex:1;overflow-y:auto;padding:4px 14px 16px;max-width:560px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.run .dock{background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}
.run .dock .in{max-width:560px;margin:0 auto}
.prog{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:8px}
.prog>div{height:100%;background:var(--acc);border-radius:4px;transition:width .2s}
.step{display:flex;align-items:center;gap:10px;margin:10px 0}
.step .lab{width:62px;font-size:12px;font-weight:800;color:var(--mut);letter-spacing:.05em}
.step .val{flex:1;text-align:center}
.step .val input{width:100%;text-align:center;border:0;background:transparent;font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:0;min-width:0;height:60px}
.step .val .u{font-size:12px;color:var(--mut);font-weight:600;margin-top:-4px;text-align:center}
.step .round{width:68px;height:68px;font-size:34px}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.setc{min-width:64px;padding:8px 10px;border-radius:12px;background:var(--card2);border:2px solid transparent;text-align:center;font-variant-numeric:tabular-nums}
.setc .a{font-size:11px;color:var(--mut);font-weight:700}
.setc .v{font-weight:800;font-size:15px}
.setc.done{background:var(--ok-soft);border-color:transparent}
.setc.done .a{color:var(--ok)}
.setc.cur{border-color:var(--acc)}
.coach{background:var(--acc-soft);border-radius:14px;padding:12px 14px;font-size:15px;margin:10px 0}
.coach b{color:var(--acc)}
.rest{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rest .t{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:96px}
.rest .bar{flex:1;height:8px;background:var(--card2);border-radius:5px;overflow:hidden}
.rest .bar>div{height:100%;background:var(--acc);transition:width .25s linear}
.feel{display:flex;gap:8px;margin-bottom:10px}
.feel button{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-weight:700}
.feel button.on{border-color:var(--acc);background:var(--acc-soft)}
.cues li{margin:6px 0}
.cues{padding-left:20px;margin:6px 0}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.hr{height:1px;background:var(--line);margin:12px 0}
a{color:var(--acc);font-weight:700}
.rating{display:flex;gap:8px;margin:8px 0 14px}
.rating button{flex:1;min-height:56px;font-size:26px;border-radius:14px;border:2px solid var(--line);background:var(--card2)}
.rating button.on{border-color:var(--acc);background:var(--acc-soft)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi div{background:var(--card2);border-radius:14px;padding:12px 8px;text-align:center}
.kpi .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--mut);font-weight:700}
pre.code{background:var(--card2);padding:12px;border-radius:12px;overflow:auto;font-size:12px;max-height:200px}
@media (min-width:700px){.app{padding-top:28px}}

</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toast"></div>
<script>
/* ===== Exercise library and split templates ===== */
const MUSCLES = {
  chest: "Chest", back: "Back", shoulders: "Shoulders", biceps: "Biceps", triceps: "Triceps",
  quads: "Quads", hamstrings: "Hamstrings", glutes: "Glutes", calves: "Calves", core: "Core"
};
const MUSCLE_ORDER = ["chest", "back", "shoulders", "biceps", "triceps", "core", "quads", "hamstrings", "glutes", "calves"];
const EQUIP = { barbell: "Barbell", dumbbell: "Dumbbell", machine: "Machine", cable: "Cable", bodyweight: "Bodyweight" };

/* E(id, name, primary, secondary[], equip, kind, [repMin, repMax], sets, rest, incr, startW, stress[], cues[], avoid, opts) */
function E(id, name, p, sec, equip, kind, rr, sets, rest, incr, startW, stress, cues, avoid, o) {
  return Object.assign({ id, name, p, sec, equip, kind, repMin: rr[0], repMax: rr[1], sets, rest, incr, startW, stress, cues, avoid }, o || {});
}

const LIB = [
  /* ---- Quads and legs ---- */
  E("goblet_squat", "Goblet Squat", "quads", ["glutes", "core"], "dumbbell", "compound", [8, 12], 3, 90, 5, 25, [],
    ["Hold one dumbbell upright against your chest with elbows tucked", "Sit down between your knees and keep your chest tall", "Push through your whole foot and stand all the way up"],
    "Heels lifting or knees caving inward"),
  E("back_squat", "Barbell Back Squat", "quads", ["glutes", "hamstrings", "core"], "barbell", "compound", [6, 10], 3, 120, 5, 65, ["back", "knee"],
    ["Bar rests on your upper back, grip it tight and brace your core", "Sit between your hips and keep knees in line with toes", "Drive up through mid-foot and keep your chest up"],
    "Rounding your lower back at the bottom"),
  E("leg_press", "Leg Press", "quads", ["glutes"], "machine", "compound", [10, 15], 3, 90, 10, 90, [],
    ["Feet shoulder width in the middle of the plate", "Lower until your knees are near 90 degrees without your hips curling off the pad", "Press up and stop just short of locking your knees"],
    "Letting your lower back peel off the seat"),
  E("hack_squat", "Hack Squat", "quads", ["glutes"], "machine", "compound", [8, 12], 3, 90, 10, 70, ["knee"],
    ["Back and hips flat against the pad", "Lower under control until thighs are about parallel", "Drive through your whole foot without bouncing"],
    "Bouncing out of the bottom"),
  E("split_squat", "Bulgarian Split Squat", "quads", ["glutes"], "dumbbell", "compound", [8, 12], 3, 90, 5, 15, ["knee"],
    ["Rear foot rests on a bench behind you", "Lower straight down with your torso slightly forward", "Push through the front heel to stand"],
    "Front foot too close to the bench", { perSide: true }),
  E("walking_lunge", "Walking Lunge", "quads", ["glutes", "hamstrings"], "dumbbell", "compound", [10, 14], 2, 90, 5, 15, ["knee"],
    ["Take a long step and drop your back knee toward the floor", "Keep your torso tall and your front knee steady", "Push off the front foot into the next step"],
    "Short steps that load the knee too much", { perSide: true }),
  E("leg_ext", "Leg Extension", "quads", [], "machine", "isolation", [12, 15], 3, 60, 5, 40, ["knee"],
    ["Line the pad up just above your ankles", "Squeeze your quads hard at the top for one second", "Lower slowly over about three seconds"],
    "Swinging the weight up with momentum"),
  /* ---- Hamstrings and glutes ---- */
  E("rdl", "Romanian Deadlift", "hamstrings", ["glutes", "back"], "barbell", "compound", [8, 12], 3, 90, 5, 65, ["back"],
    ["Soft knees and push your hips straight back", "Keep the bar close and slide it down your thighs", "Stop when you feel a deep hamstring stretch then squeeze your glutes to stand"],
    "Rounding your back or squatting the weight down"),
  E("db_rdl", "Dumbbell Romanian Deadlift", "hamstrings", ["glutes", "back"], "dumbbell", "compound", [8, 12], 3, 90, 5, 25, ["back"],
    ["Hold the dumbbells in front of your thighs", "Hinge back with a flat spine and soft knees", "Feel the stretch in your hamstrings then drive your hips forward"],
    "Letting the dumbbells drift far from your legs"),
  E("hip_thrust", "Barbell Hip Thrust", "glutes", ["hamstrings"], "barbell", "compound", [8, 12], 3, 90, 10, 65, [],
    ["Upper back on the bench with the bar over your hips", "Tuck your chin and push through your heels", "Finish with your ribs down and a hard glute squeeze"],
    "Arching your lower back instead of using your glutes"),
  E("pull_through", "Cable Pull-Through", "glutes", ["hamstrings"], "cable", "compound", [10, 15], 3, 60, 5, 30, [],
    ["Face away from the cable with the rope between your legs", "Hinge back until you feel your hamstrings stretch", "Snap your hips forward and squeeze your glutes"],
    "Turning it into a squat"),
  E("seated_leg_curl", "Seated Leg Curl", "hamstrings", [], "machine", "isolation", [10, 15], 3, 60, 5, 40, [],
    ["Pad snug above your heels and thighs held down", "Curl smoothly and squeeze at the bottom", "Return slowly without letting the stack slam"],
    "Lifting your hips or using momentum"),
  E("lying_leg_curl", "Lying Leg Curl", "hamstrings", [], "machine", "isolation", [10, 15], 3, 60, 5, 40, [],
    ["Keep your hips pressed into the pad", "Curl your heels toward your glutes", "Lower over three seconds"],
    "Hips popping up off the pad"),
  E("back_ext", "45 Degree Back Extension", "glutes", ["hamstrings", "back"], "bodyweight", "compound", [10, 15], 3, 60, 5, 0, ["back"],
    ["Hips on the pad and spine long", "Hinge forward with control", "Squeeze your glutes to come up and stop in a straight line"],
    "Hyperextending past a straight line", { bw: true }),
  E("hip_abduction", "Hip Abduction Machine", "glutes", [], "machine", "isolation", [12, 20], 2, 45, 5, 50, [],
    ["Sit tall with your back against the pad", "Push your knees out in a smooth motion", "Pause for a second then return slowly"],
    "Rocking your torso to move the weight"),
  E("standing_calf", "Standing Calf Raise", "calves", [], "machine", "isolation", [10, 15], 3, 60, 10, 60, [],
    ["Balls of your feet on the platform", "Pause with a full stretch at the bottom", "Rise as high as you can and hold for a second"],
    "Bouncing through the reps"),
  E("seated_calf", "Seated Calf Raise", "calves", [], "machine", "isolation", [12, 20], 3, 45, 5, 30, [],
    ["Pad snug on your lower thighs", "Full stretch at the bottom", "Press up to your toes and pause"],
    "Cutting the range of motion short"),
  /* ---- Chest ---- */
  E("bb_bench", "Barbell Bench Press", "chest", ["triceps", "shoulders"], "barbell", "compound", [6, 10], 3, 120, 5, 65, ["shoulder"],
    ["Shoulder blades pinched together and feet planted", "Lower the bar to your mid chest with elbows about 45 degrees", "Press up and slightly back toward your eyes"],

/* ===== Core state, helpers, planning and coaching engine ===== */
const LS_KEY = "gymcoach.v1";
const KG = 0.45359237;

function defaultState() {
  return {
    v: 1,
    cfg: {
      name: "", days: 4, minutes: 50, focus: ["full", "upper", "core"], units: "lb", theme: "auto",
      avoid: [], sound: true, vibrate: true, wake: true, warm: true, setupDone: false,
      scriptUrl: "", key: "", deloadUntil: "", lastDeload: ""
    },
    exOv: {}, slotPick: {}, custom: [], videos: {}, hidden: {},
    sessions: [], body: [], paceHist: [],
    active: null,
    cloudTs: 0,
    sync: { q: [], lastPull: 0, lastSync: 0, status: "" }
  };
}

let S = defaultState();

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const d = defaultState();
      S = Object.assign(d, p);
      S.cfg = Object.assign(d.cfg, p.cfg || {});
      S.sync = Object.assign(d.sync, p.sync || {});
    }
  } catch (e) { console.warn("load failed", e); }
}
let saveTimer = null;
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { console.warn("save failed", e); }
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 150); }

/* ----- small helpers ----- */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function dstr(d) { d = d || new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function pdate(s) { const p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { const d = pdate(s); d.setDate(d.getDate() + n); return dstr(d); }
function weekStart(s) { const d = pdate(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return dstr(d); }
function fmtDate(s) { return pdate(s).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function fmtDateLong(s) { return pdate(s).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
function mmss(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + pad2(sec % 60); }
function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function median(a) { if (!a.length) return 0; const b = a.slice().sort((x, y) => x - y); const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }

/* ----- units (weights are always stored in lb) ----- */
function isKg() { return S.cfg.units === "kg"; }
function unitLabel() { return isKg() ? "kg" : "lb"; }
function toDisp(lb) { const v = isKg() ? lb * KG : lb; return Math.round(v * 4) / 4; }
function fromDisp(v) { return isKg() ? v / KG : v; }
function fmtNum(n) { return (Math.round(n * 100) / 100).toString(); }
function fmtW(lb) { return fmtNum(toDisp(lb)); }
function stepDisp(ex) {
  const inc = ex.incr || 5;
  if (!isKg()) return inc;
  return inc >= 10 ? 5 : inc >= 5 ? 2.5 : 1.25;
}

/* ----- exercises ----- */
function allEx() { return LIB.concat(S.custom || []); }
function getEx(id) { return allEx().find(e => e.id === id) || null; }
function exCfg(id) {
  const e = getEx(id); if (!e) return null;
  const o = S.exOv[id] || {};
  return {
    sets: o.sets || e.sets, repMin: o.repMin || e.repMin, repMax: o.repMax || e.repMax,
    rest: o.rest || e.rest, incr: o.incr != null ? o.incr : e.incr
  };
}
function exStartW(e) {
  if (!e.startW) return 0;
  return fromDisp(Math.round(toDisp(e.startW) / stepDisp(e)) * stepDisp(e));
}
function videoLink(e) {
  const v = S.videos[e.id] || e.video;
  if (v) return v;
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(e.name + " proper form tutorial");
}
function isAvoided(e) { return (e.stress || []).some(s => (S.cfg.avoid || []).indexOf(s) >= 0); }

/* ----- history lookups ----- */
function sortedSessions() { return S.sessions.filter(s => !s.deleted).sort((a, b) => b.startedAt - a.startedAt); }
function sessionEx(s, exId) { return (s.ex || []).find(x => x.exId === exId); }
function doneSets(x) { return (x && x.log ? x.log : []).filter(l => l.done !== false); }
function histFor(exId, n) {
  const out = [];
  for (const s of sortedSessions()) {
    const x = sessionEx(s, exId);
    const d = doneSets(x);
    if (d.length) { out.push({ date: s.date, sets: d.map(l => ({ w: l.w, r: l.r })) }); if (out.length >= (n || 3)) break; }
  }
  return out;
}
function est1RM(w, r) { return r <= 1 ? w : w * (1 + Math.min(r, 15) / 30); }
function setScore(set, ex) {
  if (ex && ex.timed) return set.r;
  if (set.w > 0) return 1000 + est1RM(set.w, set.r);
  return set.r;
}
function bestScore(sets, ex) { return sets.reduce((m, s) => Math.max(m, setScore(s, ex)), 0); }

/* ===== Coach: double progression ===== */
function inDeload() { return !!S.cfg.deloadUntil && dstr() <= S.cfg.deloadUntil; }

function coachTarget(exId) {
  const e = getEx(exId), cfg = exCfg(exId);
  const h = histFor(exId, 3);
  const dl = inDeload();
  const base = { sets: Math.max(2, cfg.sets - (dl ? 1 : 0)), last: h[0] || null };
  if (!h.length) {
    const first = e.timed
      ? "First time. Hold a steady position for about " + cfg.repMin + " seconds and stop before your form breaks."
      : e.bw && !e.startW
        ? "First time. Use your bodyweight and aim for " + cfg.repMin + " clean reps."
        : "First time. Pick a weight you can lift " + cfg.repMax + " times with 2 or 3 reps left in the tank. Tap Easy or Hard after each set and I will adjust.";
    return Object.assign(base, { w: exStartW(e), reps: cfg.repMin, kind: "first", msg: first });
  }
  const last = h[0];
  if (e.timed) {
    const avg = last.sets.reduce((a, s) => a + s.r, 0) / last.sets.length;
    const t = Math.round((avg + 5) / 5) * 5;
    return Object.assign(base, { w: 0, reps: t, kind: "beat", msg: "Last time you averaged " + Math.round(avg) + " seconds. Aim for " + t + " seconds today." });
  }
  const topW = Math.max.apply(null, last.sets.map(s => s.w));
  const top = last.sets.filter(s => s.w >= topW - 0.01);
  const minR = Math.min.apply(null, top.map(s => s.r));
  const inc = fromDisp(toDisp(topW) + stepDisp(e)) - topW;
  let w = topW, reps, kind, msg;
  if (dl) {
    w = Math.max(0, fromDisp(Math.floor(toDisp(topW) * 0.9 / stepDisp(e)) * stepDisp(e)));
    reps = cfg.repMin + 2; kind = "deload";
    msg = "Deload week. Lighter weight and one less set. Keep every rep smooth.";
  } else if (top.length >= 2 && minR >= cfg.repMax) {
    w = topW + inc; reps = cfg.repMin; kind = "level";
    msg = "Level up. You hit " + cfg.repMax + " reps on every set last time. Go to " + fmtW(w) + " " + unitLabel() + " and build back up from " + cfg.repMin + ".";
  } else if (minR < cfg.repMin) {
    const prev = h[1];
    let prevLow = false;
    if (prev) {
      const pt = Math.max.apply(null, prev.sets.map(s => s.w));
      prevLow = Math.abs(pt - topW) < 0.01 && Math.min.apply(null, prev.sets.filter(s => s.w >= pt - 0.01).map(s => s.r)) < cfg.repMin;
    }
    if (prevLow && topW > 0) {
      w = Math.max(0, topW - (fromDisp(toDisp(topW) + stepDisp(e)) - topW)); reps = cfg.repMin; kind = "drop";
      msg = "Two tough sessions in a row at this weight. Drop to " + fmtW(w) + " " + unitLabel() + " and rebuild. This is normal.";
    } else {
      reps = cfg.repMin; kind = "hold";
      msg = "Hold at " + fmtW(w) + " " + unitLabel() + " and get every set to " + cfg.repMin + " reps or more.";
    }
  } else {
    reps = Math.min(cfg.repMax, minR + 1); kind = "beat";
    msg = "Beat last time. Aim for " + reps + " reps on every set at " + (w > 0 ? fmtW(w) + " " + unitLabel() : "bodyweight") + ".";
  }
  return Object.assign(base, { w, reps, kind, msg });
}

/* in-session adjustment after a logged set */
function nextSetSuggestion(ex, cfg, set) {
  const step = fromDisp(toDisp(set.w) + stepDisp(ex)) - set.w;
  if (ex.timed) return { w: 0, msg: "" };
  if (set.feel === "easy" && set.r >= cfg.repMax - 1) return { w: set.w + step, msg: "Felt easy. Try " + fmtW(set.w + step) + " " + unitLabel() + " next set." };
  if (set.feel === "hard" && set.r < cfg.repMin) return { w: Math.max(0, set.w - step), msg: "That was heavy. Drop to " + fmtW(Math.max(0, set.w - step)) + " " + unitLabel() + " for the next set." };
  if (set.r >= cfg.repMax && set.feel !== "hard") return { w: set.w, msg: "Top of the range. Keep this weight. Hit it on every set and you level up next session." };
  return { w: set.w, msg: "" };
}

function isStalled(exId) {
  const e = getEx(exId); const h = histFor(exId, 4);
  if (h.length < 4) return false;
  const old = bestScore(h[3].sets, e);
  const recent = Math.max(bestScore(h[0].sets, e), bestScore(h[1].sets, e), bestScore(h[2].sets, e));
  return recent <= old;
}

/* ===== Plan builder: fit a workout to the time you have ===== */
const SET_SEC = 40, SETUP_SEC = 40;

function effPriority(slot) {
  let p = slot.pr;
  const f = S.cfg.focus || [];
  const tf = TAG_FOCUS[slot.tag];
  if (tf && f.indexOf(tf) >= 0) p -= 1;
  return p;
}
function restFor(e, cfg, minutes) {
  let r = cfg.rest;
  if (minutes <= 35) r = Math.min(r, e.kind === "compound" ? 75 : 45);
  return r;
}
function itemTime(items) { /* seconds. items = [{sets, rest, ss}] */
  let t = 0; const seen = {};
  const groups = {};
  items.forEach(it => { if (it.ss) { (groups[it.ss] = groups[it.ss] || []).push(it); } });
  items.forEach(it => {
    if (it.ss && groups[it.ss].length === 2) {
      if (seen[it.ss]) return; seen[it.ss] = 1;
      const a = groups[it.ss][0], b = groups[it.ss][1];
      const n = Math.max(a.sets, b.sets);
      t += n * (SET_SEC * 2 + Math.max(a.rest, b.rest)) + SETUP_SEC * 1.5;
    } else {
      t += it.sets * (SET_SEC + it.rest) + SETUP_SEC;
    }
  });
  return t;
}
function warmMin(minutes) { return S.cfg.warm ? (minutes >= 40 ? 5 : 3) : 0; }
function pace() { return clamp(median(S.paceHist || []) || 1, 0.8, 1.5); }

function pickEx(dayKey, slot) {
  const pickKey = dayKey + ":" + slot.id;
  const picked = S.slotPick[pickKey];
  if (picked) { const pe = getEx(picked); if (pe && !isAvoided(pe)) return pe; }
  for (const id of slot.c) { const e = getEx(id); if (e && !isAvoided(e) && !S.hidden[id]) return e; }
  for (const id of slot.c) { const e = getEx(id); if (e && !isAvoided(e)) return e; }
  return null;
}

function buildPlan(dayKey, minutes) {
  const day = DAYS[dayKey];
  const useSS = minutes <= 45;
  const dl = inDeload();
  const wm = warmMin(minutes);
  const budget = (minutes - wm) * 60 / pace();
  const cand = day.slots.map((s, i) => {
    const e = pickEx(dayKey, s); if (!e) return null;
    const cfg = exCfg(e.id);
    const baseSets = S.exOv[e.id] && S.exOv[e.id].sets ? cfg.sets : s.sets;
    return {
      i, slot: s, ex: e, pr: effPriority(s), maxSets: Math.max(2, baseSets - (dl ? 1 : 0)), sets: 0,
      rest: restFor(e, cfg, minutes), ss: useSS ? s.ss : ""
    };
  }).filter(Boolean);
  const order = cand.slice().sort((a, b) => a.pr - b.pr || a.i - b.i);
  let chosen = [];
  const total = list => itemTime(list.map(c => ({ sets: c.sets, rest: c.rest, ss: c.ss })));
  for (const c of order) {
    for (let n = c.maxSets; n >= 2; n--) {
      c.sets = n;
      if (total(chosen.concat([c])) <= budget) { chosen.push(c); break; }
      c.sets = 0;
    }
  }
  /* fill spare time with extra sets on compounds first */
  let grew = true;
  while (grew) {
    grew = false;
    for (const c of chosen.slice().sort((a, b) => a.pr - b.pr || a.i - b.i)) {
      if (c.sets < 4 && c.sets >= c.maxSets && c.ex.kind === "compound" && c.pr <= 2 && !dl) {
        c.sets++;
        if (total(chosen) <= budget) grew = true; else c.sets--;
      }
    }
  }
  chosen.sort((a, b) => a.i - b.i);
  /* keep superset partners adjacent */
  const out = [];
  chosen.forEach(c => {
    if (out.indexOf(c) >= 0) return;
    out.push(c);
    if (c.ss) { const p = chosen.find(o => o !== c && o.ss === c.ss && out.indexOf(o) < 0); if (p) out.push(p); }
  });
  const exs = out.map(c => {
    const cfg = exCfg(c.ex.id);
    const paired = c.ss && out.filter(o => o.ss === c.ss).length === 2;
    return { slotId: c.slot.id, exId: c.ex.id, pr: c.pr, sets: c.sets, repMin: cfg.repMin, repMax: cfg.repMax, rest: c.rest, ss: paired ? c.ss : "" };
  });
  const est = wm + Math.round(itemTime(out.map(c => ({ sets: c.sets, rest: c.rest, ss: c.ss }))) * pace() / 60);
  return { dayKey, name: day.name, minutes, warm: wm, est, exs, useSS, dropped: cand.length - out.length };
}

/* which day is next in the rotation */
function splitKeys() { return SPLITS[S.cfg.days] || SPLITS[4]; }
function nextDayIdx() {
  const keys = splitKeys();
  const last = sortedSessions().find(s => keys.indexOf(s.dayKey) >= 0);
  if (!last) return 0;
  return (keys.indexOf(last.dayKey) + 1) % keys.length;
}

/* squeeze the remaining unstarted exercises into the time left */
function refitActive(minLeft) {
  const a = S.active; if (!a) return "";
  const rem = a.ex.map((x, i) => ({ x, i })).filter(o => !o.x.skipped && o.x.log.length === 0);
  if (!rem.length) return "Nothing left to trim.";
  const budget = minLeft * 60 / pace();
  const inProg = a.ex.filter(x => !x.skipped && x.log.length > 0 && x.log.length < x.sets);
  const timeOf = () => {
    let items = rem.filter(o => !o.x.skipped).map(o => ({ sets: o.x.sets, rest: o.x.rest, ss: o.x.ss }));
    inProg.forEach(x => items.push({ sets: x.sets - x.log.length, rest: x.rest, ss: "" }));
    return itemTime(items);
  };
  let msgs = [];
  let guard = 60;
  while (timeOf() > budget && guard-- > 0) {
    const live = rem.filter(o => !o.x.skipped);
    if (!live.length) break;
    live.sort((p, q) => q.x.pr - p.x.pr || q.i - p.i);
    const v = live[0];
    if (v.x.sets > 2) { v.x.sets--; }
    else if (live.length > 1) { v.x.skipped = true; msgs.push(getEx(v.x.exId).name); }
    else break;
  }
  a.ex.forEach(x => { if (x.ss) { const p = a.ex.find(o => o !== x && o.ss === x.ss); if (!p || p.skipped || x.skipped) x.ss = ""; } });
  return msgs.length ? "Dropped " + msgs.join(" and ") + " to fit your time." : "Trimmed sets to fit your time.";
}

/* ===== Stats ===== */
function sessionVolume(s) {
  return (s.ex || []).reduce((t, x) => {
    const e = getEx(x.exId);
    return t + doneSets(x).reduce((a, l) => a + ((e && e.timed) ? 0 : l.w * l.r), 0);
  }, 0);
}
function sessionSetCount(s) { return (s.ex || []).reduce((t, x) => t + doneSets(x).length, 0); }
function sessionsBetween(a, b) { return sortedSessions().filter(s => s.date >= a && s.date <= b); }
function weekCount(ws) { return sessionsBetween(ws, addDays(ws, 6)).length; }
function weeklyGoal() { return S.cfg.days; }
function streakWeeks() {
  const hit = Math.max(2, S.cfg.days - 1);
  let ws = weekStart(dstr()), n = 0, first = true;
  for (let k = 0; k < 104; k++) {
    const c = weekCount(ws);
    if (c >= hit) n++; else if (!first) break;
    first = false; ws = addDays(ws, -7);
  }
  return n;
}
function muscleSets(days) {
  const from = addDays(dstr(), -(days - 1));
  const m = {}; MUSCLE_ORDER.forEach(k => m[k] = 0);
  sessionsBetween(from, dstr()).forEach(s => (s.ex || []).forEach(x => {
    const e = getEx(x.exId); if (!e) return;
    const n = doneSets(x).length;
    if (m[e.p] != null) m[e.p] += n;
    (e.sec || []).forEach(k => { if (m[k] != null) m[k] += n * 0.5; });
  }));
  return m;
}
function exerciseSeries(exId) {
  const e = getEx(exId); const pts = [];
  sortedSessions().slice().reverse().forEach(s => {
    const x = sessionEx(s, exId); const d = doneSets(x); if (!d.length) return;
    let best = 0, bw = 0, br = 0;
    d.forEach(l => {
      const v = e.timed ? l.r : (l.w > 0 ? est1RM(l.w, l.r) : l.r);
      if (v > best) { best = v; bw = l.w; br = l.r; }
    });
    pts.push({ date: s.date, v: best, w: bw, r: br });
  });
  return pts;
}
function personalRecords(sessionObj) { /* compare a finished session to history before it */
  const prs = [];
  (sessionObj.ex || []).forEach(x => {
    const e = getEx(x.exId); const d = doneSets(x); if (!e || !d.length) return;
    const cur = bestScore(d, e);
    let prev = 0, had = false;
    sortedSessions().forEach(s => {
      if (s.id === sessionObj.id) return;
      const px = sessionEx(s, x.exId); const pd = doneSets(px);
      if (pd.length) { had = true; prev = Math.max(prev, bestScore(pd, e)); }
    });
    if (had && cur > prev) {
      const top = d.reduce((m, l) => setScore(l, e) > setScore(m, e) ? l : m, d[0]);
      prs.push({ exId: x.exId, w: top.w, r: top.r });
    }
  });
  return prs;
}

/* ===== Finish a workout ===== */
function finishActive(rating, notes) {
  const a = S.active; if (!a) return null;
  const now = Date.now();
  const sess = {
    id: a.id, date: dstr(new Date(a.startedAt)), dayKey: a.dayKey, name: a.name,
    startedAt: a.startedAt, endedAt: now, plannedMin: a.plannedMin, estMin: a.estMin,
    actualMin: Math.round((now - a.startedAt) / 60000), rating: rating || 0, notes: notes || "",
    deload: !!a.deload, updatedAt: now,
    ex: a.ex.filter(x => x.log.length).map(x => ({
      exId: x.exId, sets: x.sets, repMin: x.repMin, repMax: x.repMax,
      log: x.log.map(l => ({ w: l.w, r: l.r, feel: l.feel || "", done: true }))
    }))
  };
  const prs = personalRecords(sess);
  sess.prs = prs;
  if (sess.ex.length) {
    S.sessions.push(sess);
    const planned = a.ex.filter(x => !x.skipped).reduce((t, x) => t + x.sets, 0);
    if (planned && sessionSetCount(sess) >= planned * 0.6 && sess.actualMin >= 10 && sess.actualMin <= 180 && a.estMin) {
      S.paceHist.push(clamp(sess.actualMin / a.estMin, 0.6, 1.8));
      S.paceHist = S.paceHist.slice(-6);
    }
    queueOp("session", sess.id, sess);
  }
  S.active = null;
  saveState();
  return { sess, prs };
}

/* ===== Google Sheets sync (Apps Script, GET requests only) ===== */
let syncing = false;
let syncTimer = null;

function cloudBlob() {
  const cfg = Object.assign({}, S.cfg);
  delete cfg.scriptUrl; delete cfg.key; delete cfg.theme;
  return { cfg, exOv: S.exOv, slotPick: S.slotPick, custom: S.custom, videos: S.videos, hidden: S.hidden, paceHist: S.paceHist };
}
function queueCloud() {
  S.cloudTs = Date.now();
  queueOp("cloud", "main", Object.assign(cloudBlob(), { updatedAt: S.cloudTs }));
}
function queueOp(kind, id, data) {
  const q = S.sync.q;
  const i = q.findIndex(o => o.kind === kind && o.id === id);
  const op = { kind, id, ts: (data && data.updatedAt) || Date.now(), data };
  if (i >= 0) q[i] = op; else q.push(op);
  saveSoon();
  scheduleSync();
}
function scheduleSync() {
  if (!S.cfg.scriptUrl) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(false), 1500);
}
function b64u(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_");
}
async function scriptGet(params) {
  const u = new URL(S.cfg.scriptUrl);
  Object.keys(params).forEach(k => u.searchParams.set(k, params[k]));
  if (S.cfg.key) u.searchParams.set("key", S.cfg.key);
  const r = await fetch(u.toString(), { redirect: "follow" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (j && j.ok === false) throw new Error(j.error || "Script error");
  return j;
}
async function pushOp(op) {
  const payload = b64u(JSON.stringify({ kind: op.kind, id: op.id, ts: op.ts, data: op.data }));
  const size = 1700, n = Math.max(1, Math.ceil(payload.length / size));
  const tid = uid();
  for (let i = 0; i < n; i++) {
    await scriptGet({ action: "put", tid, i, n, d: payload.slice(i * size, (i + 1) * size) });
  }
}
function mergeItem(it) {
  const d = it.data; if (!d) return;
  if (it.kind === "cloud") {
    if (it.ts > S.cloudTs) {
      const keepU = S.cfg.scriptUrl, keepK = S.cfg.key, keepT = S.cfg.theme;
      if (d.cfg) S.cfg = Object.assign(S.cfg, d.cfg);
      S.cfg.scriptUrl = keepU; S.cfg.key = keepK; S.cfg.theme = keepT;
      S.exOv = d.exOv || {}; S.slotPick = d.slotPick || {}; S.custom = d.custom || [];
      S.videos = d.videos || {}; S.hidden = d.hidden || {}; S.paceHist = d.paceHist || S.paceHist;
      S.cloudTs = it.ts;
    }
    return;
  }
  const list = it.kind === "session" ? S.sessions : S.body;
  const i = list.findIndex(x => x.id === it.id);
  const pending = S.sync.q.find(o => o.kind === it.kind && o.id === it.id);
  if (pending && pending.ts >= it.ts) return;
  if (i < 0) list.push(d);
  else if ((list[i].updatedAt || 0) < it.ts) list[i] = d;
}
async function syncNow(manual) {
  if (!S.cfg.scriptUrl) { if (manual) { S.sync.status = "Add your script URL in Settings first."; uiRefreshSoft(); } return; }
  if (syncing) return;
  syncing = true; S.sync.status = "Syncing..."; uiRefreshSoft();
  try {
    if (!S.sync.seeded) {
      S.sessions.forEach(s => { if (!S.sync.q.some(o => o.kind === "session" && o.id === s.id)) S.sync.q.push({ kind: "session", id: s.id, ts: s.updatedAt || s.endedAt || Date.now(), data: s }); });
      S.body.forEach(b => { if (!S.sync.q.some(o => o.kind === "body" && o.id === b.id)) S.sync.q.push({ kind: "body", id: b.id, ts: b.updatedAt || Date.now(), data: b }); });
      if (!S.sync.q.some(o => o.kind === "cloud")) S.sync.q.push({ kind: "cloud", id: "main", ts: S.cloudTs || 1, data: Object.assign(cloudBlob(), { updatedAt: S.cloudTs || 1 }) });
      S.sync.seeded = true; saveSoon();
    }
    while (S.sync.q.length) {
      const op = S.sync.q[0];
      await pushOp(op);
      S.sync.q.shift(); saveSoon();
    }
    const res = await scriptGet({ action: "pull", since: S.sync.lastPull });
    (res.items || []).forEach(mergeItem);
    if (res.now) S.sync.lastPull = res.now;
    S.sync.lastSync = Date.now();
    S.sync.status = "Synced just now";
    saveState();
  } catch (e) {
    S.sync.status = (navigator.onLine === false ? "Offline. " : "Sync problem: " + (e && e.message ? e.message : "unknown") + ". ") + "Your data is safe on this phone and will retry.";
  }
  syncing = false;
  uiRefreshSoft();
  if (typeof onSyncDone === "function") onSyncDone();
}
async function testScript() {
  try {
    const r = await scriptGet({ action: "ping" });
    return "Connected to sheet: " + (r.name || "OK");
  } catch (e) { return "Could not connect: " + (e && e.message ? e.message : "unknown"); }
}
function syncAgo() {
  if (!S.sync.lastSync) return "Never synced";
  const m = Math.round((Date.now() - S.sync.lastSync) / 60000);
  return m < 1 ? "Synced just now" : m < 60 ? "Synced " + m + " min ago" : "Synced " + Math.round(m / 60) + " h ago";
}
window.addEventListener("online", () => { if (S.cfg.scriptUrl) syncNow(false); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.cfg.scriptUrl && Date.now() - (S.sync.lastSync || 0) > 60000) syncNow(false);
});

/* ----- audio, haptics, wake lock ----- */
let actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function beep(times) {
  if (!S.cfg.sound) return;
  try {
    ensureAudio(); if (!actx) return;
    for (let i = 0; i < (times || 3); i++) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = i === (times || 3) - 1 ? 1100 : 800;
      o.connect(g); g.connect(actx.destination);
      const t0 = actx.currentTime + i * 0.22;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      o.start(t0); o.stop(t0 + 0.18);
    }
  } catch (e) {}
}
function buzz(p) { if (S.cfg.vibrate && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }
let wakeLock = null;
async function acquireWake() {
  if (!S.cfg.wake || !("wakeLock" in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function releaseWake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.active && ui.runView) acquireWake();
});

/* ----- charts ----- */
function lineChart(pts, opt) {
  opt = opt || {};
  const W = 340, H = opt.h || 170, L = 34, R = 10, T = 12, B = 24;
  if (!pts.length) return '<div class="empty">No data yet</div>';
  const xs = pts.map(p => pdate(p.date).getTime());
  let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  if (x0 === x1) { x0 -= 86400000 * 3; x1 += 86400000 * 3; }
  let y0 = Math.min.apply(null, pts.map(p => p.v)), y1 = Math.max.apply(null, pts.map(p => p.v));
  const padY = (y1 - y0) * 0.15 || Math.max(1, y1 * 0.05);
  y0 = Math.max(0, y0 - padY); y1 = y1 + padY;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let d = "", dots = "";
  pts.forEach((p, i) => {
    const x = X(xs[i]).toFixed(1), y = Y(p.v).toFixed(1);
    d += (i ? "L" : "M") + x + " " + y;
    dots += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="var(--acc)"/>';
  });
  let grid = "";
  for (let g = 0; g <= 3; g++) {
    const v = y0 + (y1 - y0) * g / 3, y = Y(v).toFixed(1);
    grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (+y + 4) + '" text-anchor="end">' + Math.round(v) + "</text>";
  }
  const lab = '<text x="' + L + '" y="' + (H - 6) + '">' + fmtDate(pts[0].date) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtDate(pts[pts.length - 1].date) + "</text>";
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(opt.label || "Chart") + '">' + grid +
    '<path d="' + d + '" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + dots + lab + "</svg>";
}

/* ----- timers ----- */
function remainingSec() {
  const a = S.active; if (!a) return 0;
  const items = [];
  a.ex.forEach(x => {
    if (x.skipped) return;
    const left = Math.max(0, x.sets - x.log.length);
    if (left > 0) items.push({ sets: left, rest: x.rest, ss: x.log.length ? "" : x.ss });
  });
  return itemTime(items) * pace();
}
function tick() {
  const a = S.active;
  if (!a || !ui.runView) return;
  const now = Date.now();
  const el = $("#elapsed"); if (el) el.textContent = mmss((now - a.startedAt) / 1000);
  const lf = $("#left"); if (lf) lf.textContent = "~" + Math.max(0, Math.round(remainingSec() / 60)) + " min left";
  const r = a.rest;
  if (r) {
    const leftMs = r.end - now;
    const rt = $("#restTime"), rb = $("#restBar");
    if (leftMs <= 0) {
      if (!r.fired) { r.fired = true; beep(3); buzz([200, 100, 200]); saveSoon(); render(); }
    } else {
      if (rt) rt.textContent = mmss(Math.ceil(leftMs / 1000));
      if (rb) rb.style.width = Math.max(0, Math.min(100, (1 - leftMs / (r.total * 1000)) * 100)) + "%";
    }
  }
}
setInterval(tick, 250);

/* ===== Main views: Today, Progress, Library, Settings ===== */
function fmtSets(e, sets) {
  if (e.timed) return sets.map(s => s.r + "s").join(", ");
  const groups = [];
  sets.forEach(s => {
    const g = groups.find(g => Math.abs(g.w - s.w) < 0.01);
    if (g) g.r.push(s.r); else groups.push({ w: s.w, r: [s.r] });
  });
  return groups.map(g => (g.w > 0 ? fmtW(g.w) + " " + unitLabel() : "BW") + " × " + g.r.join(", ")).join("  |  ");
}
function repLabel(x) { return x.repMin === x.repMax ? "" + x.repMin : x.repMin + "-" + x.repMax; }
function curMinutes() { return ui.minutes || S.cfg.minutes; }
function curDayIdx() { return ui.dayIdx != null ? ui.dayIdx : nextDayIdx(); }
function greet() {
  const h = new Date().getHours();
  const g = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  return S.cfg.name ? g + ", " + esc(S.cfg.name) : g;
}

/* ----- coach insights ----- */
function insights() {
  const out = [];
  const ss = sortedSessions();
  const today = dstr();
  if (!ss.length) {
    out.push({ ic: "&#128075;", t: "Welcome", x: "Pick how long you have and tap Start. Your first session is about finding your starting weights. I will tell you what to lift next time." });
    return out;
  }
  const last = ss[0];
  const days = Math.round((pdate(today) - pdate(last.date)) / 86400000);
  if (days >= 5) out.push({ ic: "&#9201;", t: "Let us get back to it", x: "It has been " + days + " days. Even a 30 minute session keeps the habit alive. Pick a shorter time and go." });
  if (last.prs && last.prs.length) {
    const nm = getEx(last.prs[0].exId);
    out.push({ ic: "&#127942;", t: last.prs.length + " new PR" + (last.prs.length > 1 ? "s" : "") + " last workout", x: (nm ? nm.name : "A lift") + " hit a new best. That is real progress." });
  }
  const seen = {};
  for (const s of ss.slice(0, 6)) for (const x of (s.ex || [])) {
    if (seen[x.exId]) continue; seen[x.exId] = 1;
    if (isStalled(x.exId)) {
      const e = getEx(x.exId);
      if (e) { out.push({ ic: "&#128260;", t: e.name + " has stalled", x: "No progress in 4 sessions. Check sleep and food, or swap to a similar exercise for a few weeks. Tap the swap button in your plan." }); break; }
    }
  }
  const wk = sessionsBetween(weekStart(today), today).length;
  if (wk >= 2) {
    const m = muscleSets(7);
    const lag = ["chest", "back", "shoulders", "quads", "hamstrings", "glutes", "core"].map(k => [k, m[k]]).sort((a, b) => a[1] - b[1])[0];
    if (lag && lag[1] < 5) out.push({ ic: "&#127919;", t: MUSCLES[lag[0]] + " is lagging", x: "Only " + Math.round(lag[1]) + " sets this week. Your next workouts will keep it in the mix." });
  }
  let wks = 0, ws = weekStart(today);
  const ld = S.cfg.lastDeload || "";
  for (let k = 0; k < 12; k++) {
    if (ld && addDays(ws, 6) <= ld) break;
    if (weekCount(ws) >= 2) wks++; else if (k > 0) break;
    ws = addDays(ws, -7);
  }
  if (wks >= 6 && !inDeload()) out.push({ ic: "&#128564;", t: "Consider a deload week", x: wks + " solid weeks in a row. A lighter week helps your joints and gains catch up.", btn: "Start deload week", act: "deloadOn" });
  if (inDeload()) out.push({ ic: "&#128564;", t: "Deload week is on", x: "Lighter weights and fewer sets until " + fmtDate(S.cfg.deloadUntil) + ". Keep it easy.", btn: "End deload", act: "deloadOff" });
  return out.slice(0, 3);
}

  h += '<div class="scroll-x" style="margin-bottom:12px">' + keys.map((k, i) =>

  h += '<div class="card"><div class="row between"><div><h3>' + esc(plan.name) + '</h3><div class="mut sm">About ' + plan.est + " min, " + plan.exs.length + " exercises</div></div>" +
    (plan.useSS ? '<span class="pill acc">Supersets on</span>' : "") + "</div>";
  if (plan.warm) h += '<div class="coach sm" style="margin:12px 0 4px"><b>Warm-up (' + plan.warm + ' min):</b> easy cardio or arm circles and bodyweight squats. Then do 1 or 2 light ramp-up sets of your first lift.</div>';
  plan.exs.forEach((p, i) => {
    const e = getEx(p.exId); const t = coachTarget(p.exId);
    let line;
    if (t.kind === "first") line = '<span class="pill warn">First time</span> start light';
    else if (e.timed) line = "Aim for " + t.reps + " sec";

    else if (t.kind === "deload") line = '<span class="pill warn">Deload</span> ' + (t.w > 0 ? fmtW(t.w) + " " + unitLabel() : "bodyweight");
    else line = (t.w > 0 ? fmtW(t.w) + " " + unitLabel() : "Bodyweight") + " × " + t.reps + "+";
    const prev = plan.exs[i - 1], next = plan.exs[i + 1];
    const showSS = p.ss && ((prev && prev.ss === p.ss) || (next && next.ss === p.ss));
    h += '<div class="exrow' + (showSS ? " ss" : "") + '"><div class="grow"><button class="nm" style="background:none;border:0;padding:0;text-align:left;font-weight:700" data-act="exDetail" data-id="' + p.exId + '">' + esc(e.name) + "</button>" +
      '<div class="sm mut">' + p.sets + " × " + (e.timed ? repLabel(p) + " sec" : repLabel(p)) + (e.perSide ? " each side" : "") + " &middot; " + line + "</div>" +
      (showSS && !(prev && prev.ss === p.ss) ? '<div class="xs acc b">Superset with next</div>' : "") + "</div>" +
      '<button class="iconbtn" data-act="swapPlan" data-slot="' + p.slotId + '" aria-label="Swap exercise">' + IC.swap + "</button>" +
      '<button class="iconbtn" data-act="editPlanEx" data-id="' + p.exId + '" aria-label="Edit sets and reps">' + IC.edit + "</button></div>";
  });
  const skipped = DAYS[dk].slots.filter(s => { const e = pickEx(dk, s); return e && !plan.exs.some(p => p.slotId === s.id); }).map(s => pickEx(dk, s).name);
  if (skipped.length) h += '<div class="sm mut" style="margin-top:8px">Left out to fit ' + mins + " min: " + esc(skipped.join(", ")) + ". Add time to bring them back.</div>";
  h += "</div>";
  if (!S.active) h += '<button class="btn pri big block" data-act="start" style="margin-bottom:14px">Start workout</button>';
  const ins = insights();
  if (ins.length) {
    h += '<div class="card"><h2>Coach</h2>' + ins.map(i => '<div class="tip"><div class="ic">' + i.ic + '</div><div class="grow"><div class="b">' + esc(i.t) + '</div><div class="sm mut">' + esc(i.x) + "</div>" +
      (i.btn ? '<button class="btn sm" style="margin-top:8px" data-act="' + i.act + '">' + esc(i.btn) + "</button>" : "") + "</div></div>").join("") + "</div>";
  }
  return h;
}

/* ----- PROGRESS ----- */
function viewProgress() {
  const subs = [["overview", "Overview"], ["lifts", "Lifts"], ["body", "Body"], ["history", "History"]];
  let h = '<div class="top"><div><h1>Progress</h1></div></div><div class="seg">' + subs.map(s => '<button class="' + (ui.prog === s[0] ? "on" : "") + '" data-act="progTab" data-s="' + s[0] + '">' + s[1] + "</button>").join("") + "</div>";
  if (ui.prog === "lifts") return h + progLifts();
  if (ui.prog === "body") return h + progBody();
  if (ui.prog === "history") return h + progHistory();
  const ss = sortedSessions(), today = dstr(), ws = weekStart(today);
  const wkS = sessionsBetween(ws, today);
  const vol = wkS.reduce((t, s) => t + sessionVolume(s), 0);
  h += '<div class="card"><div class="stats">' +
    '<div class="stat"><div class="n">' + ss.length + '</div><div class="l">Workouts logged</div></div>' +
    '<div class="stat"><div class="n">' + wkS.length + "/" + weeklyGoal() + '</div><div class="l">This week</div></div>' +
    '<div class="stat"><div class="n">' + streakWeeks() + '</div><div class="l">Week streak</div></div>' +
    '<div class="stat"><div class="n">' + Math.round(toDisp(vol)).toLocaleString() + '</div><div class="l">Volume this week (' + unitLabel() + ")</div></div></div></div>";
  let cells = "";
  const thisWs = weekStart(today);
  const dayHas = {}; ss.forEach(s => dayHas[s.date] = 1);
  for (let r = 0; r < 7; r++) for (let c = 0; c < 12; c++) {
    const d = addDays(thisWs, -(11 - c) * 7 + r);
    cells += d > today ? '<i style="opacity:.25"></i>' : '<i class="' + (dayHas[d] ? "l3" : "") + '" title="' + d + '"></i>';
  }
  h += '<div class="card"><h2>Last 12 weeks</h2><div class="heat">' + cells + '</div><div class="xs mut" style="margin-top:8px">Each square is a day. Orange means you trained. Columns run oldest to newest.</div></div>';
  const m = muscleSets(7);
  h += '<div class="card"><h2>Hard sets per muscle, last 7 days</h2><div class="bars">' + MUSCLE_ORDER.map(k => {
    const v = m[k], pct = clamp(v / 16 * 100, 0, 100);
    return '<div class="bar"><div class="lbl">' + MUSCLES[k] + '</div><div class="trk"><div class="fill ' + (v < 6 ? "lo" : v >= 10 ? "hi" : "") + '" style="width:' + pct + '%"></div></div><div class="val">' + Math.round(v) + "</div></div>";
  }).join("") + '</div><div class="xs mut" style="margin-top:8px">A common target is 10 to 16 hard sets per muscle each week. Secondary muscles count half.</div></div>';
  const prs = [];
  ss.slice(0, 8).forEach(s => (s.prs || []).forEach(p => prs.push({ date: s.date, p })));
  if (prs.length) {
    h += '<div class="card"><h2>Recent PRs</h2>' + prs.slice(0, 6).map(o => {
      const e = getEx(o.p.exId);
      return '<div class="row between" style="padding:8px 0"><div class="b">' + esc(e ? e.name : "Exercise") + '</div><div class="mut sm">' + (e && e.timed ? o.p.r + "s" : (o.p.w > 0 ? fmtW(o.p.w) + " " + unitLabel() + " × " : "") + o.p.r) + " &middot; " + fmtDate(o.date) + "</div></div>";
    }).join("") + "</div>";
  }

    if (left > 0) {
      const logged = a.ex[r.exIdx] && a.ex[r.exIdx].log[r.setIdx];
      h += '<div class="rest"><div class="t" id="restTime">' + mmss(Math.ceil(left / 1000)) + '</div><div class="bar"><div id="restBar" style="width:' + Math.max(0, Math.min(100, (1 - left / (r.total * 1000)) * 100)) + '%"></div></div>' +
        '<button class="btn sm" data-act="restAdd" data-s="-15">-15</button><button class="btn sm" data-act="restAdd" data-s="15">+15</button><button class="btn sm" data-act="restSkip">Skip</button></div>';
      if (logged && !(getEx(a.ex[r.exIdx].exId).timed)) {
        h += '<div class="feel">' + [["easy", "Easy"], ["good", "Good"], ["hard", "Hard"]].map(f => '<button class="' + (logged.feel === f[0] ? "on" : "") + '" data-act="feel" data-v="' + f[0] + '">' + f[1] + "</button>").join("") + "</div>";
      }
      if (r.msg) h += '<div class="sm" style="margin-bottom:8px"><b class="acc">Coach:</b> ' + esc(r.msg) + "</div>";
    } else {
      h += '<div class="row between" style="margin-bottom:8px"><div class="b ok">Rest done. Time to lift.</div><button class="btn sm" data-act="restSkip">Dismiss</button></div>';
    }
  }
  let label;
  if (x.skipped) label = "Next exercise";
  else if (exComplete(x)) label = allDone() ? "All done. Finish workout" : "Exercise done. Next";
  else label = "Log set " + (x.log.length + 1) + " of " + x.sets;
  h += '<div class="row"><button class="iconbtn" style="width:56px;height:64px" data-act="prevEx" aria-label="Previous exercise">' + IC.left + '</button><button class="btn pri big grow" data-act="logSet">' + label + '</button>' +
    '<button class="iconbtn" style="width:56px;height:64px" data-act="nextEx" aria-label="Next exercise">' + IC.right + "</button></div></div></div></div>";
  return h;
}

/* ----- runner actions ----- */
A.step = d => {
  const a = S.active, x = a.ex[a.cur], e = getEx(x.exId), dir = +d.d;
  if (d.k === "w") x.curW = Math.max(0, fromDisp(Math.max(0, toDisp(x.curW) + dir * stepDisp(e))));
  else x.curR = Math.max(0, x.curR + dir * (e.timed ? 5 : 1));
  saveSoon(); render();
};
A.setVal = (d, t) => {
  const a = S.active, x = a.ex[a.cur], v = parseFloat(String(t.value).replace(",", "."));
  if (isNaN(v) || v < 0) { render(); return; }
  if (d.k === "w") x.curW = fromDisp(v); else x.curR = Math.round(v);
  saveSoon(); render();
};
A.logSet = () => {
  ensureAudio();
  const a = S.active; const x = a.ex[a.cur], e = getEx(x.exId);
  if (exComplete(x)) {
    if (allDone()) { A.finish(); return; }
    const n = findNextIncomplete(a.cur); if (n >= 0) { a.cur = n; saveSoon(); render(); } return;
  }
  const set = { w: e.timed ? 0 : x.curW, r: Math.max(0, Math.round(x.curR)), feel: "", done: true, ts: Date.now() };
  if (set.r <= 0) { toast("Set your reps first"); return; }
  x.log.push(set); buzz(30);
  const sug = nextSetSuggestion(e, { repMin: x.repMin, repMax: x.repMax }, set);
  const prevIdx = a.cur;
  let restSec = x.rest, nextIdx = a.cur, msg = sug.msg;
  const pi = x.ss ? a.ex.findIndex((o, i) => i !== a.cur && o.ss === x.ss) : -1;
  const p = pi >= 0 ? a.ex[pi] : null;
  if (p && !exComplete(p)) {
    nextIdx = pi;
    restSec = a.cur < pi ? 15 : Math.max(x.rest, p.rest);
    if (a.cur < pi) msg = "Superset. Switch to " + getEx(p.exId).name + " now.";
  } else if (exComplete(x)) {
    const n = findNextIncomplete(a.cur);
    if (n >= 0) { nextIdx = n; msg = (msg ? msg + " " : "") + "Up next: " + getEx(a.ex[n].exId).name + "."; }
  }
  if (nextIdx === prevIdx && !exComplete(x)) { x.curW = sug.w; x.curR = set.r; }
  const nx = a.ex[nextIdx];
  if (nextIdx !== prevIdx && nx.log.length) { const lg = nx.log[nx.log.length - 1]; nx.curW = lg.w; nx.curR = lg.r; }
  if (allDone()) { a.rest = null; toast("All sets done. Tap Finish when you are ready."); }
  else a.rest = { end: Date.now() + restSec * 1000, total: restSec, msg, exIdx: prevIdx, setIdx: x.log.length - 1, next: nextIdx, fired: false };
  a.cur = nextIdx;
  saveState(); render();
};
A.feel = d => {
  const a = S.active, r = a.rest; if (!r) return;
  const x = a.ex[r.exIdx], set = x.log[r.setIdx], e = getEx(x.exId);
  set.feel = d.v;
  const sug = nextSetSuggestion(e, { repMin: x.repMin, repMax: x.repMax }, set);
  if (r.next === r.exIdx && !exComplete(x)) { x.curW = sug.w; }
  if (r.next === r.exIdx) r.msg = sug.msg || (d.v === "hard" ? "Take your full rest. Keep the reps clean." : "");
  saveSoon(); render();
};
A.restAdd = d => { const r = S.active.rest; if (r) { r.end += (+d.s) * 1000; r.total = Math.max(r.total, Math.ceil((r.end - Date.now()) / 1000)); r.fired = false; saveSoon(); render(); } };
A.restSkip = () => { S.active.rest = null; saveSoon(); render(); };
A.prevEx = () => { const a = S.active; if (a.cur > 0) { a.cur--; saveSoon(); render(); } };
A.nextEx = () => { const a = S.active; if (a.cur < a.ex.length - 1) { a.cur++; saveSoon(); render(); } };
A.toggleCues = () => { ui.showCues = !ui.showCues; render(); };
A.addSet = () => { const x = S.active.ex[S.active.cur]; x.sets++; saveSoon(); render(); };
A.skipEx = () => {
  const a = S.active, x = a.ex[a.cur];
  if (x.log.length) x.sets = x.log.length; else x.skipped = true;
  const n = findNextIncomplete(a.cur); if (n >= 0) a.cur = n;
  saveSoon(); render();
};
A.unskip = () => { S.active.ex[S.active.cur].skipped = false; saveSoon(); render(); };
A.trim = () => {
  const a = S.active; const left = Math.max(5, a.plannedMin - (Date.now() - a.startedAt) / 60000);
  toast(refitActive(left)); const x = a.ex[a.cur]; if (exComplete(x)) { const n = findNextIncomplete(a.cur); if (n >= 0) a.cur = n; }
  saveState(); render();
};

/* ===== Bottom sheets and their actions ===== */
function chipRow(k, opts, cur, act) {
  return '<div class="chips">' + opts.map(o => '<button class="chip lg' + (cur === o[0] ? " on" : "") + '" data-act="' + (act || "sfSet") + '" data-k="' + k + '" data-v="' + o[0] + '" data-n="' + (typeof o[0] === "number" ? 1 : 0) + '">' + o[1] + "</button>").join("") + "</div>";
}
function stepRow(label, k, val, min, max, stepv, suffix) {
  return '<div class="row between" style="padding:10px 0;border-top:1px solid var(--line)"><div class="b">' + label + '</div><div class="row"><button class="round" style="width:48px;height:48px;font-size:26px" data-act="sfStep" data-k="' + k + '" data-d="' + (-stepv) + '" data-min="' + min + '" data-max="' + max + '">&minus;</button>' +
    '<div class="b" style="min-width:64px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums">' + val + (suffix || "") + '</div><button class="round" style="width:48px;height:48px;font-size:26px" data-act="sfStep" data-k="' + k + '" data-d="' + stepv + '" data-min="' + min + '" data-max="' + max + '">+</button></div></div>';
}
A.sfSet = d => { ui.sheet[d.k] = d.n === "1" ? +d.v : d.v; render(); };
A.sf = (d, t) => { ui.sheet[d.k] = t.value; };
A.sfStep = d => { const s = ui.sheet; s[d.k] = clamp(Math.round((s[d.k] + (+d.d)) * 100) / 100, +d.min, +d.max); render(); };
A.sfFocus = d => { const f = ui.sheet.focus, i = f.indexOf(d.v); if (i >= 0) { if (f.length > 1) f.splice(i, 1); } else f.push(d.v); render(); };
A.closeSheet = () => closeSheet();
function confirmSheet(title, text, yes, fn) { openSheet({ type: "confirm", title, text, yes, fn }); }
A.confirmYes = () => { const fn = ui.sheet.fn; closeSheet(); if (fn) fn(); };

function renderSheet() {
  const s = ui.sheet;
  switch (s.type) {
    case "setup": return sheetSetup(s);
    case "exDetail": return sheetExDetail(s);
    case "editEx": return sheetEditEx(s);
    case "swap": return sheetSwap(s);
    case "addEx": return sheetWrap('<h2 class="t">Add an exercise</h2><div class="mut" style="margin-bottom:12px">It goes at the end of your workout.</div>' + libFilters() + '<div class="card" id="libList" style="padding:4px 16px">' + libListHtml("addExPick") + "</div>");
    case "customEx": return sheetCustom(s);
    case "runList": return sheetRunList(s);
    case "timeLeft": return sheetWrap('<h2 class="t">Short on time?</h2><div class="mut" style="margin-bottom:14px">Tell me how many minutes you have left. I keep the most important lifts and trim the rest.</div><div class="chips">' +
      [10, 15, 20, 25, 30, 45].map(m => '<button class="chip lg" data-act="timeLeftDo" data-m="' + m + '">' + m + " min</button>").join("") + "</div>");
    case "editSet": return sheetEditSet(s);
    case "finish": return sheetFinish(s);
    case "done": return sheetDone(s);
    case "bodyLog": return sheetBody(s);
    case "sessDetail": return sheetSess(s);
    case "syncHelp": return sheetSyncHelp();
    case "confirm": return sheetWrap('<h2 class="t">' + esc(s.title) + '</h2><div class="mut" style="margin:6px 0 16px">' + esc(s.text) + '</div><div class="row"><button class="btn grow" data-act="closeSheet">Cancel</button><button class="btn pri grow" data-act="confirmYes">' + esc(s.yes) + "</button></div>");
  }
  return "";
}

/* ----- exercise detail ----- */

A.saveVideo = (d, t) => { const v = t.value.trim(); if (v) S.videos[d.id] = v; else delete S.videos[d.id]; queueCloud(); saveState(); toast(v ? "Video link saved" : "Video link cleared"); };

/* ----- edit sets and reps ----- */
A.editPlanEx = d => { const c = exCfg(d.id), e = getEx(d.id); openSheet({ type: "editEx", mode: "plan", exId: d.id, sets: c.sets, repMin: c.repMin, repMax: c.repMax, rest: c.rest, incr: e.incr }); };
A.editRunEx = () => { const a = S.active, x = a.ex[a.cur], e = getEx(x.exId); openSheet({ type: "editEx", mode: "run", exId: x.exId, sets: x.sets, repMin: x.repMin, repMax: x.repMax, rest: x.rest, incr: exCfg(x.exId).incr, saveDef: false }); };
function sheetEditEx(s) {
  const e = getEx(s.exId);
  const steps = isKg() ? [[1.25, "1.25 kg"], [2.5, "2.5 kg"], [5, "5 kg"]] : [[2.5, "2.5 lb"], [5, "5 lb"], [10, "10 lb"]];

  let x = '<h2 class="t">' + esc(e.name) + '</h2><div class="mut" style="margin-bottom:10px">' + (s.mode === "run" ? "Change this for the rest of today." : "These become your defaults for this exercise.") + "</div>";
  x += stepRow("Sets", "sets", s.sets, 1, 8, 1, "") + stepRow(e.timed ? "Min seconds" : "Min reps", "repMin", s.repMin, 1, 100, e.timed ? 5 : 1, "") + stepRow(e.timed ? "Max seconds" : "Max reps", "repMax", s.repMax, 1, 100, e.timed ? 5 : 1, "") + stepRow("Rest", "rest", s.rest, 15, 300, 15, "s");

}
A.toggleSaveDef = () => { ui.sheet.saveDef = !ui.sheet.saveDef; render(); };
A.saveEditEx = () => {
  const s = ui.sheet; if (s.repMax < s.repMin) s.repMax = s.repMin;

  } else {

};
A.resetEx = () => { delete S.exOv[ui.sheet.exId]; queueCloud(); saveState(); closeSheetSafe(); toast("Back to the original"); };

/* ----- swap ----- */
A.swapPlan = d => {
  const keys = splitKeys(), dk = keys[curDayIdx() % keys.length];
  openSheet({ type: "swap", mode: "plan", dk, slot: d.slot });
};
A.swapRun = () => openSheet({ type: "swap", mode: "run" });
function sheetSwap(s) {
  let cur, list = [];
  if (s.mode === "plan") {
    const slot = DAYS[s.dk].slots.find(q => q.id === s.slot);
    cur = pickEx(s.dk, slot);
    list = slot.c.map(getEx).filter(Boolean);
    allEx().forEach(e => { if (e.p === cur.p && e.kind === cur.kind && list.indexOf(e) < 0) list.push(e); });
  } else {
    cur = getEx(S.active.ex[S.active.cur].exId);
    list = allEx().filter(e => e.p === cur.p);
  }
  list = list.filter(e => e.id !== cur.id && !isAvoided(e)).slice(0, 14);
  return sheetWrap('<h2 class="t">Swap exercise</h2><div class="mut" style="margin-bottom:10px">Gym busy or something not feeling right? Pick another way to train the same muscle' + (s.mode === "plan" ? ". I will use it from now on in this slot." : ".") + '</div><div class="card list" style="padding:4px 16px">' +
    (list.length ? list.map(e => '<button class="it" data-act="doSwap" data-id="' + e.id + '"><div class="grow"><div class="b">' + esc(e.name) + '</div><div class="sm mut">' + (EQUIP[e.equip] || "Other") + " &middot; " + repLabel(e) + " reps</div></div></button>").join("") : '<div class="empty">No alternatives found.</div>') + "</div>" +
    (s.mode === "plan" && S.slotPick[s.dk + ":" + s.slot] ? '<button class="btn ghost block" data-act="doSwap" data-id="">Reset to the default pick</button>' : "") +
    '<button class="btn block" style="margin-top:8px" data-act="closeSheet">Cancel</button>');
}
A.doSwap = d => {
  const s = ui.sheet;
  if (s.mode === "plan") {
    const key = s.dk + ":" + s.slot;
    if (d.id) S.slotPick[key] = d.id; else delete S.slotPick[key];
    queueCloud(); saveState(); closeSheetSafe(); toast(d.id ? "Swapped" : "Reset");
  } else {
    const x = S.active.ex[S.active.cur], c = exCfg(d.id), t = coachTarget(d.id);
    x.exId = d.id; x.repMin = c.repMin; x.repMax = c.repMax; x.rest = c.rest; x.curW = t.w; x.curR = t.reps;

  }
};
